    <!-- Theme State Initializer -->
    <script>
      (function() {
        try {
          var e = localStorage.getItem("mody-theme");
          if ("dark" === e || (!e && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
        } catch (err) {}
      })();
    </script>
